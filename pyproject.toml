[project]
name = "broker-bench"
version = "0.1.0"
description = "Agent-to-agent commerce prototype: does a broker bot capture more in fees than it spends on reasoning?"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "anthropic>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Upstream providers are pinned to commit SHAs; they are wrapped, never vendored.
providers = [
    "edshield @ git+https://github.com/hemangnagar/edshield@a568e73a6c34d40335802235db81950e84004ab1",
    "decision-gate @ git+https://github.com/hemangnagar/decision_gate@d22f183267e0c74d813e3de534393e867ec1393c",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["registry", "providers", "settlement", "agents", "runner", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
