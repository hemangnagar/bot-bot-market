# Scenario generator config. `make smoke` / `make run` draw N tasks from `mix` with `seed`.
seed: 7
budget_usd_per_task: 0.25
mix:                       # share of each task type in a run
  scrub_basic: 0.20        # single service; both scrubbers fit; cheapest is fine
  scrub_strict: 0.20       # single service; two providers match the keywords but only the better one passes
  adjudicate: 0.20         # single service: two claims in, verdict out
  chain: 0.25              # two services in sequence: scrub, then adjudicate claims about the scrubbed note
  impossible: 0.15         # no provider fits; the broker must decline cleanly, the buyer must not pay
impossible_tasks:
  - "Translate the following note into French and return it as `translated_text`."
  - "Book a 30-minute meeting room for tomorrow at 10:00 and return `booking_id`."
  - "Convert the attached note into a spoken-audio file and return `audio_url`."
  - "Fetch today's EUR/USD exchange rate and return it as `rate`."
  - "Summarize the note into three bullet points in Spanish and return `summary`."
claims:
  - ["Students who attend two tutoring sessions a week improve their grades by one letter within a semester.", "Tutoring frequency has no measurable effect on grades once homework completion is controlled for."]
  - ["Moving the class to a four-day week will reduce absenteeism by 20%.", "A four-day week shifts absences to the remaining days and changes nothing overall."]
  - ["Replacing the paper permission slips with an app will raise return rates above 90%.", "Families without smartphones will be excluded, so return rates will fall."]
  - ["The reading intervention should be expanded to all third-grade classes next year.", "The pilot had 12 students and no control group; the effect could be noise."]
  - ["Late homework should be accepted at full credit for one week.", "Full credit for late work always lowers on-time submission."]
  - ["The school should switch its LMS vendor before the fall term.", "A mid-year vendor switch never finishes on time and guarantees data loss."]
